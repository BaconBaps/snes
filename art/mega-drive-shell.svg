  <path d="M101 47q10-26 47-39 34-12 76 0" fill="none" stroke="#aa9aab" stroke-opacity=".45" stroke-width=".9" stroke-linecap="round"/>
  <path d="M94 69q7 23 33 35" fill="none" stroke="#a28c9b" stroke-opacity=".32" stroke-width="1.15"/>
  <path d="M104 74q11 19 34 28" fill="none" stroke="#897481" stroke-opacity=".22" stroke-width="2"/>
  <path d="M204 113q39-4 62-26" fill="none" stroke="#ae7e92" stroke-opacity=".24" stroke-width="1"/>
  <path d="M109 42q2-9 17-12 50-9 116 0 16 3 19 13l-4 7H113Z" fill="#1e1c27" stroke="#605969" stroke-width=".65"/>

  <!-- Raised 16-bit badge and the curved power inlay. -->
  <path d="M138 69q1-4 5-5 42-8 86 0 5 1 6 5l4 33q-52 24-105 0Z" fill="#14121d" stroke="#13121b" stroke-width="1.7"/>
  <path d="M139 69q1-3 5-4 40-7 84 0 5 1 6 5l3 28q-50 22-102 0Z" fill="url(#badge)" stroke="#5e5261" stroke-width=".72"/>
  <path d="M135 95q52 18 101 0l2 13q-51 21-105 0Z" fill="url(#inlay)" stroke="#544b56" stroke-width=".55"/>
  <path d="M136 95q51 17 100 0" fill="none" stroke="#f0deca" stroke-opacity=".76" stroke-width=".65"/>

  <!-- Recessed controls, volume track, and headphone jack. -->
  <g transform="translate(-16 0)">
    <path d="M39 75h56q8 1 7 8l-5 43H32l-4-3 7-43q1-4 4-5Z" fill="#201d29" stroke="#655969" stroke-width=".65"/>
