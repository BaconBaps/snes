<svg xmlns="http://www.w3.org/2000/svg" width="347.3" height="159" viewBox="-22.65 0 347.3 159">
  <defs>
    <linearGradient id="cabinet" x1="0" y1="0" x2=".68" y2="1">
      <stop stop-color="#50505b"/><stop offset=".23" stop-color="#3b3a45"/>
      <stop offset=".61" stop-color="#272632"/><stop offset="1" stop-color="#1a1923"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#181721"/><stop offset=".45" stop-color="#282631"/>
      <stop offset=".69" stop-color="#35323d"/><stop offset=".83" stop-color="#26242e"/>
      <stop offset="1" stop-color="#13121b"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#45404e" stop-opacity="0"/><stop offset=".36" stop-color="#615869"/>
      <stop offset=".62" stop-color="#36313f"/><stop offset="1" stop-color="#1a1823"/>
