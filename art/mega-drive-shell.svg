  <ellipse cx="185" cy="68" rx="95" ry="60" fill="#15121d" opacity=".84"/>
  <path d="M92 57h186v11c0 33-42 58-93 58s-93-26-93-58Z" fill="url(#ring-wall)" stroke="#171520" stroke-width=".9"/>
