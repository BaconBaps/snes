  <path d="M53 147q3-2 6 0" fill="none" stroke="#c3a69c" stroke-opacity=".65" stroke-width=".65"/>
  <path d="M154 145q1-3 5-3h89q4 0 5 3l-3 8h-93Z" fill="#25222e" stroke="#514758" stroke-width=".65"/>
