      <stop offset=".74" stop-color="#2b2835"/><stop offset="1" stop-color="#16141f"/>
    </linearGradient>
    <linearGradient id="disc" x1=".18" y1="0" x2=".65" y2="1">
      <stop stop-color="#54525e"/><stop offset=".30" stop-color="#3d3b48"/>
      <stop offset=".70" stop-color="#30303c"/><stop offset="1" stop-color="#22212e"/>
