  <path d="M19 18h46M18 22h46M17 26h46M16 30h46M14 34h46M13 38h46M12 42h46M11 46h46M9 50h46M8 54h46M7 58h46M6 62h46M4 66h46M3 70h46" fill="none" stroke="#686174" stroke-opacity=".74" stroke-width=".7" stroke-linecap="round"/>

